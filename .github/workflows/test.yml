name: Tests

on:
  # Branches only, deliberately not tags: a version tag reaches this file through
  # release.yml's `uses:` instead, so the installer job can *depend* on the
  # result. Left as a bare `push:` the two would merely race, and a red suite
  # would not stop the release.
  push:
    branches: ["**"]
  pull_request:
  # Callable as a reusable workflow — that is how release.yml gates on it.
  workflow_call:

# Checkout is all these jobs need. Declared explicitly because a reusable
# workflow inherits the caller's token otherwise, and release.yml holds
# `contents: write` to publish a release — rights the test suite must not get.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the version the release installer is built with (release.yml).
      # They must not drift: the two differing was how a TLS regression stayed
      # invisible — the source tree verified certificates with Python 3.14's
      # defaults while the shipped .exe used 3.11's stricter ones.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # Anti-regrowth guard (issue #95): every tracked .py stays <= 1200 lines
      # (allowlist in the script for deliberate exceptions).  HARD gate — the
      # Backend-Modularisierung (PRD #71) that shrank webapp.py 6173 -> ~293 is
      # finished, so structure regrowth fails CI from day one.  Pure stdlib + git,
      # so it runs before the dependency install and fails fast.
      - name: Anti-regrowth line-budget guard (<= 1200 lines/.py)
        run: python scripts/check_line_budget.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Check plugin boundary (P3)
        run: lint-imports



      # Coverage baseline: 73 % (measured 2026-06-15 against 541 tests,
      # --cov=. includes test files which run at 100 %).  Gate fails if total
      # coverage drops below this number, so test-net shrinkage is caught
      # immediately during the refactor.
      - name: Run pytest with coverage (no-drop gate ≥ 73 %)
        run: pytest -v --cov=. --cov-report=term-missing --cov-fail-under=73

  # SPA smoke tests (issue #54): buildless Vue-3-CDN frontend, vitest + jsdom.
  js-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run JS smoke tests
        run: npm test

  # Frozen-build smoke (issue #72): runs PyInstaller analysis + onedir bundle
  # on every push/PR using localbib.spec so that module moves that would break
  # the .exe are caught before they reach a release build.  Runs on Linux
  # (ubuntu-latest) because the Analysis phase — which resolves all transitive
  # imports — is what matters; the resulting ELF binary is discarded.
  frozen-build-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Same pin as the release build — this job only means anything if it
      # analyses the interpreter the installer actually ships.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # Runtime deps only (no dev tools); PyInstaller added on top. No plugin
      # deps: add-ons are not part of the binary (ADR-0021), they load at
      # runtime from an installed Bundle or a Dev-Suchpfad.
      - name: Install runtime dependencies + PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      # --noconfirm  — don't prompt when overwriting dist/
      # --clean      — wipe PyInstaller cache before build for reproducibility
      # localbib.spec carries the canonical hiddenimports / excludes / datas
      # used by the real release; running it here means a missing import caused
      # by a module move fails Analysis and the job turns red.
      - name: PyInstaller analysis + bundle (smoke)
        run: pyinstaller --noconfirm --clean localbib.spec

      # Confirm the bundled entry-point landed where we expect (Linux path).
      - name: Verify bundle entry-point exists
        run: test -f dist/LocalBib/LocalBib

      # The Add-on contract promises the complete stdlib (#183): a Bundle's
      # vendor/ brings its packages, never the stdlib. These are the modules
      # the #183 spike found missing from the exe; the list derivation itself
      # is covered by tests/test_frozen_spec.py.
      - name: Bundled archive carries the stdlib a Bundle's vendor/ needs
        run: >-
          python -c "import glob, sys; from PyInstaller.archive.readers import ZlibArchiveReader;
          toc = ZlibArchiveReader(glob.glob('build/**/PYZ-*.pyz', recursive=True)[0]).toc;
          want = ['fileinput', 'timeit', 'cProfile', 'pstats', 'doctest', 'optparse', 'pdb', 'graphlib', 'pickletools', 'wsgiref', 'plistlib'];
          missing = [m for m in want if m not in toc];
          sys.exit('missing from the exe: ' + ', '.join(missing) if missing else 0)"

      # Start the frozen app with a Dev-Suchpfad Bundle and ask /api/plugins
      # once: without plugin_api's Manifest schema in the exe every Manifest
      # check dies and this answers 500 (#183).
      - name: Frozen app lists a Bundle on /api/plugins
        env:
          LITERATUR_BASE_DIR: ${{ runner.temp }}/localbib-smoke
          LOCALBIB_PORT: "8765"
          LOCALBIB_RESTARTED: "1"
          LOCALBIB_PLUGIN_DEV_PATHS: ${{ github.workspace }}/plugin_api/tests/fixtures/hello
        run: |
          dist/LocalBib/LocalBib > smoke.log 2>&1 &
          pid=$!
          code=000
          for _ in $(seq 1 60); do
            code=$(curl -s -o plugins.json -w '%{http_code}' http://127.0.0.1:8765/api/plugins || true)
            [ "$code" != "000" ] && break
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          echo "--- app log"; cat smoke.log
          echo "--- /api/plugins ($code)"; cat plugins.json || true
          test "$code" = "200"
          grep -q '"hello"' plugins.json

