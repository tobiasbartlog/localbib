<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalBib</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/static/icons/localbib-32.png">
    <link rel="icon" type="image/png" sizes="256x256" href="/static/icons/localbib.png">
    <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: ['class', '[data-theme="dark"]'],
            theme: {
                fontFamily: {
                    serif: ['Newsreader', 'ui-serif', 'Georgia', 'serif'],
                    sans:  ['Geist', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                    mono:  ['Geist Mono', 'ui-monospace', 'monospace'],
                },
                extend: {
                    // Die Tokens zeigen auf die CSS-Variablen aus style.css statt
                    // auf feste Hexwerte: Tailwind-Klassen kennen `data-theme`
                    // nicht, ein hier eingefrorenes #ffffff bleibt im Dark Mode
                    // weiss. Im Light Mode sind die Variablenwerte exakt die
                    // alten Hexwerte -- das Licht-Rendering bleibt identisch.
                    colors: {
                        bg:        { DEFAULT: 'var(--lb-bg)', elev: 'var(--lb-bg-elev)', soft: 'var(--lb-bg-soft)' },
                        ink:       { DEFAULT: 'var(--lb-ink)', 2: 'var(--lb-ink-2)', 3: 'var(--lb-ink-3)' },
                        mute:      { DEFAULT: 'var(--lb-mute)', 2: 'var(--lb-mute-2)' },
                        hairline:  { DEFAULT: 'var(--lb-hairline)', 2: 'var(--lb-hairline-2)' },
                        accent:    { DEFAULT: 'var(--lb-accent)', soft: 'var(--lb-accent-soft)', ink: 'var(--lb-accent-ink)' },
                    },
                    boxShadow: {
                        hairline: 'var(--lb-shadow)',
                        modal:    'var(--lb-shadow-lg)',
                    },
                }
            }
        }
    </script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="https://unpkg.com/vue-router@4/dist/vue-router.global.prod.js"></script>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <!-- CodeMirror 5 (buildless — ADR-0002 deferred): Notiz-Editor (Markdown)
         und LaTeX-Editor teilen sich eine Instanz der Bibliothek. -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/markdown/markdown.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/continuelist.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/stex/stex.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>
    <!-- Markdown-Rendering fuer Notizen und Research-Chat. DOMPurify ist nicht
         optional, sobald gespeicherter Text als HTML eingesetzt wird. -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.4.14/purify.min.js"></script>
    <!-- Bump BOTH ?v= stamps together on every static change. app.js and
         style.css are one unit: the SPA binds `var(--lb-*)` tokens that live in
         the stylesheet, so a browser holding one version and fetching the other
         renders a broken page (an unresolved var() paints every chart series
         black). One stamp, both files, same commit. -->
    <link rel="stylesheet" href="/static/style.css?v=20260916a">
</head>
<body class="bg-bg text-ink font-sans min-h-screen">
    <div id="app"></div>
    <script src="/static/app.js?v=20260916a"></script>
</body>
</html>
